<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CircuitSim++</title>
    <script>
      // Apply the persisted theme before first paint (UI_OVERHAUL §2) —
      // no white/dark flash on startup. App.tsx owns the live preference;
      // this only mirrors it onto <html> for the initial frame.
      //
      // OLED was the old default but its true-black canvas can hide wire
      // strokes on some displays, so an existing OLED choice is migrated to
      // Dark once (the marker keeps a later, deliberate OLED pick).
      try {
        var key = "csx.theme";
        var migration = "csx.theme.oled-migrated";
        var t = localStorage.getItem(key);
        if (localStorage.getItem(migration) === null) {
          localStorage.setItem(migration, "1");
          if (t === "oled") {
            t = "dark";
            localStorage.setItem(key, t);
          }
        }
        var themes = [
          "oled",
          "dark",
          "midnight",
          "nord",
          "dracula",
          "gruvbox",
          "solarized",
          "contrast",
          "light",
          "paper",
          "solarized-light",
        ];
        if (themes.indexOf(t) !== -1) document.documentElement.dataset.theme = t;
      } catch (e) {
        /* storage unavailable — keep the Dark default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
