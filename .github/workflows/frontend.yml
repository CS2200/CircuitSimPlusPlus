# Frontend CI — React app + Tauri shell (docs/tasks/FRONTEND.md).
# Produces unsigned desktop bundles on all three OSes (DESIGN.md §9, D14).
name: frontend

on:
  push:
    paths: ["frontend/**", "crates/app/**", "docs/ipc.md", "Cargo.toml", "Cargo.lock"]
  pull_request:
    paths: ["frontend/**", "crates/app/**", "docs/ipc.md", "Cargo.toml", "Cargo.lock"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Tauri Linux prerequisites (webview).
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Lint
        run: npm --prefix frontend run lint

      - name: Unit tests
        run: npm --prefix frontend run test

      - name: E2E (chromium, Linux only)
        if: runner.os == 'Linux'
        run: |
          npx --prefix frontend playwright install --with-deps chromium
          npm --prefix frontend run test:e2e

      - name: Tauri build (unsigned)
        working-directory: crates/app
        run: ../../frontend/node_modules/.bin/tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: circuitsimpp-${{ matrix.os }}
          path: |
            crates/app/target/release/bundle/dmg/*.dmg
            crates/app/target/release/bundle/nsis/*.exe
            crates/app/target/release/bundle/macos/*.app
            crates/app/target/release/bundle/deb/*.deb
          if-no-files-found: warn
