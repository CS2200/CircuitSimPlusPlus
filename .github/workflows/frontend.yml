# Frontend CI — React app + Tauri shell (docs/tasks/FRONTEND.md).
# Produces unsigned desktop bundles on all three OSes (DESIGN.md §9, D14).
#
# CI runs on the PUBLIC github.com mirror only: GT's GHES has no runners, so the
# `if:` guard keeps pushes to GHES from queueing jobs forever. See
# docs/distribution.md. Bundles live under the workspace-root `target/`
# (Cargo hoists it), i.e. target/release/bundle/…, NOT crates/app/target/….
name: frontend

on:
  push:
    paths: ["frontend/**", "crates/app/**", "docs/ipc.md", "Cargo.toml", "Cargo.lock"]
  pull_request:
    paths: ["frontend/**", "crates/app/**", "docs/ipc.md", "Cargo.toml", "Cargo.lock"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Tauri Linux prerequisites (webview).
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Lint
        run: npm --prefix frontend run lint

      - name: Unit tests
        run: npm --prefix frontend run test

      - name: Tauri build (unsigned)
        working-directory: crates/app
        run: ../../frontend/node_modules/.bin/tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: circuitsimpp-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/macos/*.app
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  # E2E runs in the PINNED Playwright image, not on the bare runner: the
  # committed `*-chromium-linux.png` canvas baselines are pixel-exact only for a
  # known font+browser environment, and the bare Ubuntu runner renders them
  # differently (system font stack). Baselines must be regenerated inside this
  # exact image:
  #   docker run --rm --ipc=host -v "$PWD:/work" -w /work/frontend \
  #     mcr.microsoft.com/playwright:v1.63.0-noble \
  #     bash -lc 'npm ci && npx playwright test --update-snapshots'
  # Bump the image tag whenever @playwright/test is bumped, then regenerate.
  e2e:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # Chromium wants a real /dev/shm; the runner default is small.
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Install frontend deps
        run: npm --prefix frontend ci
      - name: E2E (Playwright, pinned image)
        run: npm --prefix frontend run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
