# Backend CI — csim-core + csim (docs/tasks/BACKEND.md).
# The Tauri shell (crates/app) is intentionally NOT built here; it is owned by
# frontend.yml (needs webview system deps).
name: backend

on:
  push:
    paths: ["crates/core/**", "crates/cli/**", "tests/**", "Cargo.toml", "Cargo.lock"]
  pull_request:
    paths: ["crates/core/**", "crates/cli/**", "tests/**", "Cargo.toml", "Cargo.lock"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p csim-core -p csim --all-targets -- -D warnings
      - run: cargo test -p csim-core -p csim

  # Static musl build of the autograder CLI (DESIGN.md §8, G1).
  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p csim --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: csim-linux-x86_64-musl
          path: target/x86_64-unknown-linux-musl/release/csim
