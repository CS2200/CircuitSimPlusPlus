# Release — tag push (v*) → matrix Tauri builds → GitHub Release with
# unsigned bundles (DESIGN.md §9, D14). The release body carries the
# unsigned-build workaround text students need.
name: release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RELEASE_BODY: |
    **These builds are unsigned** (team decision — no paid signing certificate).
    Your OS will warn; the builds are fine. One-time workaround:

    - **macOS:** right-click the app → **Open** → Open. (Or: `xattr -d com.apple.quarantine CircuitSim++.app`)
    - **Windows:** SmartScreen → **More info** → **Run anyway**.

    Linux: no packaged desktop build — the autograder CLI (`csim`) is the
    Linux artifact; TAs can build the app from source.

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Tauri build (unsigned)
        working-directory: crates/app
        run: ../../frontend/node_modules/.bin/tauri build

      # Windows: zip the .exe so the download is a single portable file.
      - name: Zip Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem crates/app/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Compress-Archive -Path $exe.FullName -DestinationPath "circuitsimpp-windows.zip"

      - name: Release (macOS dmg)
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: ${{ env.RELEASE_BODY }}
          files: crates/app/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release (Windows exe + zip)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: ${{ env.RELEASE_BODY }}
          files: |
            crates/app/target/release/bundle/nsis/*.exe
            circuitsimpp-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
